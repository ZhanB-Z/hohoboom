        const rad = clamp((d - d0.pref) / 90, -1, 1), tan = (1 - Math.abs(rad) * .6) * e.sdS * .6, ux = mvx, uy = mvy;
        mvx = ux * rad - uy * tan; mvy = uy * rad + ux * tan;
      } else if (d < d0.pref - 60) { mvx = -mvx; mvy = -mvy; sp *= .8; }
      else if (d <= d0.pref + 40) { const t = mvx; mvx = -mvy * e.sd; mvy = t * e.sd; sp *= .5; }
      e.sh -= dt;
      if (e.pkW > 0) sp *= .25;   // Королева колдует пики: почти стоит
      if (e.wind > 0) { e.wind -= dt; sp *= .3; if (e.wind <= 0) enemyFire(e); }
      else if (e.sh <= 0) e.wind = e.t === 'queen' ? .7 : .5;
      if (e.spiral > 0) { e.spT -= dt; if (e.spT <= 0) { e.spT = .07; eproj(e.x, e.y, e.spA, 210, 'shard', 7); e.spA += .55; e.spiral--; } }
    }
    if (e.t === 'krampus') {
      if (e.cwind > 0) {   // приседание перед рывком: почти стоит на месте, игрок успевает среагировать
        e.cwind -= dt; sp *= .15;
        if (e.cwind <= 0) {   // рывок: направление фиксируется в момент старта, поэтому от него можно увернуться
          e.dashT = KC_DASH; e.dash = rand(2.5, 4.5); e.ddx = dx / d; e.ddy = dy / d;
          shake = Math.max(shake, 10); sfx.big(); addRing(e.x, e.y, 90, '#b44cff', .35);
        }
      } else {
        e.dash -= dt;
        if (e.dashT > 0) {
          e.dashT -= dt; sp *= KC_DASH_SPEED; mvx = e.ddx; mvy = e.ddy; e.a = Math.atan2(e.ddy, e.ddx);
          burst(e.x, e.y, 2, ['#b44cff', '#ff2b2b', '#fff'], 90, .5, 5, true);
        }
        else if (e.dash <= 0) { e.cwind = KC_WIND; tone(70, .6, 'sawtooth', .06, -30); }
      }
    }
    if (e.t === 'nutcracker' && e.entered) {
      e.st -= dt; e.sm -= dt;
      if (e.stW > 0) {
        e.stW -= dt; sp = 0;
        if (e.stW <= 0) { shocks.push({ x: e.x, y: e.y, r: e.r, max: 380, hit: false }); shake = 14; sfx.big(); }
      } else if (e.st <= 0) { e.stW = .9; e.st = rand(4, 5.5); }
      if (e.sm <= 0) {
        e.sm = 9; callout('ПОДКРЕПЛЕНИЕ!', '#ffa94d', 40);
        for (let i = 0; i < 3; i++) { const a = rand(0, TAU); makeEnemy('ginger', clamp(e.x + Math.cos(a) * 60, 20, W - 20), clamp(e.y + Math.sin(a) * 60, 20, H - 20), true); }
      }
    }
    // на льду монстры тоже скользят: скорость подтягивается к желаемой медленно
    // Королева не ходит, а плывёт: разгоняется и тормозит медленно
    const eRt = Math.min(1, (e.t === 'queen' ? 2.2 : iceAt(e.x, e.y) ? 1.2 : 18) * dt);
    e.ivx = (e.ivx || 0) + (mvx * sp - (e.ivx || 0)) * eRt; e.ivy = (e.ivy || 0) + (mvy * sp - (e.ivy || 0)) * eRt;
    e.x += e.ivx * dt; e.y += e.ivy * dt; e.ph += dt * sp / 12;
    if ((d0.pref || e.t === 'krampus') && e.entered) { e.x = clamp(e.x, 30, W - 30); e.y = clamp(e.y, 30, H - 30); }
  }
  e.x += e.kx * dt; e.y += e.ky * dt;
  const f = Math.pow(.02, dt); e.kx *= f; e.ky *= f;
  const pr = PRINTS[e.t];   // следы: каждый тип оставляет свой отпечаток через заданное расстояние
  if (pr && e.px !== undefined) {
    const mdx = e.x - e.px, mdy = e.y - e.py;
    e.fd = (e.fd || 0) + Math.hypot(mdx, mdy);
    if (e.fd > pr.step) {
      e.fd = 0; e.fs = -(e.fs || 1);
      const ma = Math.atan2(mdy, mdx);
      addPrint(e.x - Math.sin(ma) * e.r * .35 * e.fs, e.y + Math.cos(ma) * e.r * .35 * e.fs, ma, pr.k, pr.s);
    }
  }
  e.px = e.x; e.py = e.y;
  if (!e.dead && !(e.appT > 0) && d < e.r + P.r - 3) hurtPlayer(e);   // Королева в момент появления не ранит касанием (удар уже был)
}
// снаряды монстров и ударные волны Щелкунчика
function updateEnemyShots(dt) {
  for (const b of eb) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) b.dead = true;
    if (!b.dead && P.inv <= 0 && Math.hypot(P.x - b.x, P.y - b.y) < b.r + P.r - 4) {
      b.dead = true;
      burst(b.x, b.y, 10, b.kind === 'shard' ? ['#8fe8ff', '#fff'] : ['#fff', '#bfe6ff'], 200, .4, 3, true);
      hurtPlayer(b);
    }
  }
  eb = eb.filter(b => !b.dead);
  for (const s of shocks) {
    s.r += 380 * dt;
    if (!s.hit && P.inv <= 0 && Math.abs(Math.hypot(P.x - s.x, P.y - s.y) - s.r) < 16) { s.hit = true; hurtPlayer(s); }
  }

// мины и хлопушки
function updateMines(dt) {
  for (const m of mines) {
    m.life -= dt;
    if (m.kind === 'cracker') { m.fuse -= dt; if (m.fuse <= 0) { m.life = 0; explode(m.x, m.y, 110, 4, true, '#ffa94d'); } continue; }
    if (m.chain > 0) { m.chain -= dt; if (m.chain <= 0) mineBoom(m); continue; }   // задело взрывом соседней мины
    if (m.arm > 0) { m.arm -= dt; continue; }
    if (m.life <= 0) { mineBoom(m); continue; }   // время вышло: взрывается сама, а не пропадает зря
    for (const e of enemies) if (!e.dead && Math.hypot(e.x - m.x, e.y - m.y) < e.r + 70) { mineBoom(m); break; }   // было +38
  }

}
// подарки и бонусы на земле
function updatePickups(dt) {
  for (const g of gifts) { g.life -= dt; g.fl -= dt; if (g.life <= 0) g.dead = true; }
  gifts = gifts.filter(g => !g.dead);
  const mr = 140 + 60 * U('magnet');
  for (const o of orbs) {
    o.life -= dt; o.ph += dt * 4;
    const d = Math.hypot(P.x - o.x, P.y - o.y);
    if (d < mr) { o.x += (P.x - o.x) / d * 260 * dt; o.y += (P.y - o.y) / d * 260 * dt; }
    if (d < P.r + 16) { o.dead = true; collect(o.type); }
  }
  orbs = orbs.filter(o => !o.dead && o.life > 0);
}

function laserTick(dt) {
  // лучей: 1 + уровень «Двойного залпа» (до 4), веером
  const [bx, by] = muzzle(), n = 1 + U('multi'), SPREAD = .13, rays = [];
  for (let k = 0; k < n; k++) { const a = P.a + (k - (n - 1) / 2) * SPREAD; rays.push({ c: Math.cos(a), s: Math.sin(a) }); }
  P.beam = { x: bx, y: by, rays };
  P.lt -= dt; P.bt -= dt;
  const rm = rateMul();
  if (P.lt > 0) return;
  P.lt = .06;
  const dmg = .6 * dmgMul() * rm;   // урон каждого луча (раньше луч был один, с уроном ×(1 + 0,5 за уровень залпа))
  const onRay = (x, y, r) => rays.some(({ c, s }) => { const ex = x - bx, ey = y - by; return ex * c + ey * s > 0 && Math.abs(ex * s - ey * c) < r; });
  let hit = false;
  for (const e of enemies) {
    if (e.dead) continue;
    for (const { c, s } of rays) {   // вблизи лучи перекрываются, и враг получает от каждого
      const ex = e.x - bx, ey = e.y - by;
      if (ex * c + ey * s > 0 && Math.abs(ex * s - ey * c) < e.r + 18) {   // было +6: луч был слишком узким
        burst(e.x, e.y, 1, ['#5fe0ff', '#fff'], 120, .25, 2.5, true);
        damageEnemy(e, dmg); hit = true;
        if (e.dead) break;
      }
    }
  }
  if (hit && Math.random() < .5) sfx.beam();   // шипение, когда луч кого-то жжёт
  for (const b of eb) if (b.kind === 'snow' && !b.dead && onRay(b.x, b.y, b.r + 6)) { b.dead = true; burst(b.x, b.y, 12, ['#fff', '#5fe0ff'], 200, .4, 3); }
  if (P.bt <= 0) {
    P.bt = .3;
    for (const g of gifts) if (!g.dead && onRay(g.x, g.y, 26)) hitGift(g);
  }
}

// пушистая меховая кайма из мелких кружков вдоль дуги
function fur(cx, cy, rad, a0, a1, n, sz) {
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (n - 1), x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
    const g = ctx.createRadialGradient(x - 1, y - 1, 0, x, y, sz);
    g.addColorStop(0, '#fff'); g.addColorStop(1, '#cdd9f0');

  }
}
// объём для круглых тел: блик в сторону света (фонарь Санты / луна), тёмный край
function shadeBlob(e, r) {
  const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1, w = clamp(1 - d / 320, 0, 1);
  const hx = (dx / d * w - .6 * (1 - w)) * r * .5, hy = (dy / d * w - .6 * (1 - w)) * r * .5;

  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
}

// Платье Королевы. Картинка делится на треугольники веером вокруг головы. Каждая точка подола чуть
// смещается: по краю бегут медленные волны, а при движении задний край тянется назад шлейфом, передний
// чуть поджимается. Голова в центре веера стоит на месте. Соседние треугольники делят общие вершины,
// поэтому щелей между ними нет. vx, vy — скорость в системе картинки (уже повёрнутой).
const DRESS_N = 24;
function drawDress(img, px, py, s, e, vx, vy) {
  const R = Math.hypot(Math.max(px, img.width - px), Math.max(py, img.height - py)) + 4;
  const vk = clamp(Math.hypot(vx, vy) / 80, 0, 1), va = Math.atan2(vy, vx), ph = e.v;
  const vert = [];
  for (let i = 0; i <= DRESS_N; i++) {
    const th = i / DRESS_N * TAU, c = Math.cos(th - va);
    // шлейф захватывает не только самый задний край, но и бока — так он шире
    const back = vk * clamp((.35 - c) / 1.35, 0, 1), front = vk * Math.max(0, c);
    const rot = Math.sin(time * 2.2 + ph - th * 3) * (.03 + .03 * vk) + Math.sin(th - va) * back * .1;
    const k = 1 + back * .26 - front * .05 + Math.sin(time * 3.1 + ph + th * 2) * .022;
    vert.push([px + Math.cos(th) * R, py + Math.sin(th) * R, Math.cos(th + rot) * R * s * k, Math.sin(th + rot) * R * s * k]);
  }
  for (let i = 0; i < DRESS_N; i++) {
    const [s1x, s1y, d1x, d1y] = vert[i], [s2x, s2y, d2x, d2y] = vert[i + 1];
    // линейное преобразование: исходный треугольник (голова, 1, 2) → новый (0, d1, d2)
    const u1x = s1x - px, u1y = s1y - py, u2x = s2x - px, u2y = s2y - py, det = u1x * u2y - u2x * u1y;
    const a = (d1x * u2y - d2x * u1y) / det, c = (d2x * u1x - d1x * u2x) / det;
    const b = (d1y * u2y - d2y * u1y) / det, d = (d2y * u1x - d1y * u2x) / det;
    ctx.save();
    // треугольник чуть шире (на полградуса и пару пикселей), чтобы на стыках не было волосяных линий
    const ex = 1.03, gx = (d1x + d2x) / 3, gy = (d1y + d2y) / 3;
    ctx.beginPath(); ctx.moveTo(-gx * .03, -gy * .03);
    ctx.lineTo(gx + (d1x - gx) * ex, gy + (d1y - gy) * ex); ctx.lineTo(gx + (d2x - gx) * ex, gy + (d2y - gy) * ex);

function drawBossIntro(a) {
  if (a <= 0 || !introE) return;
  ctx.fillStyle = `rgba(70,0,12,${.32 * a})`; ctx.fillRect(0, 0, W, H);
  const bh = H * .11 * a;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
  const p = 1 - introT / INTRO_T, ta = clamp((p - .2) / .15, 0, 1) * clamp((.9 - p) / .1, 0, 1);
  if (ta <= 0) return;
  ctx.globalAlpha = ta;
  const sc = 1 + (1 - ta) * .15;
  ctx.save(); ctx.translate(W / 2, H * .76); ctx.scale(sc, sc);
  bigText(ENM[introE.t].name, 0, Math.min(84, W / 9), '#ff4d5a', '#ff0000', 0);
  ctx.font = `italic 22px ${FONT}`; ctx.fillStyle = '#e8c4c4'; ctx.textAlign = 'center';
  ctx.fillText(BOSS_SUB[introE.t], 0, 42);
  ctx.restore(); ctx.globalAlpha = 1;
}

function screenSpace(fn) {   // временно рисуем в пикселях экрана: W и H на время вызова = размер окна
  const w = W, h = H;
  W = innerWidth; H = innerHeight;
  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fn();
  ctx.restore(); W = w; H = h;
}
// кнопки режимов в меню: клик или клавиши 1 / 2 / 3
function modeRects() {
  const w = Math.min(230, (W - 80) / 3), h = 78, gap = 22, x0 = W / 2 - (3 * w + 2 * gap) / 2, y = H / 2 + 128;
  return MODE_KEYS.map((k, i) => ({ k, x: x0 + i * (w + gap), y, w, h }));
}
function drawModeButtons() {
  const hov = modeRects().find(r => mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h);
  for (const [i, r] of modeRects().entries()) {
    const m = MODES[r.k], on = hov ? hov === r : r.k === mode;
    ctx.save();
    ctx.fillStyle = on ? 'rgba(255,210,63,.18)' : 'rgba(10,20,50,.6)'; ctx.strokeStyle = on ? '#ffd23f' : 'rgba(150,180,230,.5)'; ctx.lineWidth = on ? 3 : 1.5;
    if (on) { ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 18; }
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill(); ctx.shadowBlur = 0; ctx.stroke();
    ctx.textAlign = 'center'; ctx.font = `bold 22px ${FONT}`; ctx.fillStyle = on ? '#ffd23f' : '#fff';
    ctx.fillText(`${i + 1}  ${m.n}`, r.x + r.w / 2, r.y + 32);
    let rec = 0; try { rec = +localStorage.getItem('hohoboom_best_' + r.k) || 0; } catch (e) {}
    ctx.font = `15px ${FONT}`; ctx.fillStyle = '#9fb6e0';
    ctx.fillText(`${m.waves} волн${rec ? '  •  рекорд ' + rec.toLocaleString('ru-RU') : ''}`, r.x + r.w / 2, r.y + 58);
    ctx.restore();
  }
  ctx.globalAlpha = .6 + .4 * Math.sin(time * 4); ctx.font = `bold 20px ${FONT}`; ctx.fillStyle = '#ffd23f'; ctx.textAlign = 'center';
  ctx.fillText('Выбери режим: клик или 1 / 2 / 3  •  Enter — последний', W / 2, H / 2 + 238); ctx.globalAlpha = 1;
}
function pickMode(k) {
  mode = k; try { localStorage.setItem('hohoboom_mode', k); } catch (e) {}
  loadBest(); startGame();
}
function render() {
  ctx.setTransform(DPR * ZOOM_OUT, 0, 0, DPR * ZOOM_OUT, 0, 0);
  const ia = introA();
  ctx.fillStyle = '#0b1530'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (zoom > .001 || ia > 0) {   // наезд камеры на босса во время вступления
    const sc = 1 + zoom + .45 * ia;
    let fx = W / 2, fy = H / 2;
    if (introE) {
      fx = clamp(W / 2 + (introE.x - W / 2) * ia, W / (2 * sc), W - W / (2 * sc));
      fy = clamp(H / 2 + (introE.y - H / 2) * ia, H / (2 * sc), H - H / (2 * sc));
    }
    ctx.translate(W / 2, H / 2); ctx.scale(sc, sc); ctx.translate(-fx, -fy);
  }
  if (shake > 0 && state !== 'pause') ctx.translate(rand(-shake, shake) * .5, rand(-shake, shake) * .5);
  ctx.drawImage(bg, 0, 0, W, H);
  if (propLayer) ctx.drawImage(propLayer, 0, 0, W, H);
  ctx.drawImage(dec, 0, 0);
  drawIce();
  drawSparks();
  drawPrints();
  drawStreaks();
  drawLights();
  if (P && state !== 'menu') {
    mines.forEach(drawMine);
    orbs.forEach(drawOrb); gifts.forEach(drawGift);
    drawShocks(); drawQueenMarks();
    drawDying();
    enemies.forEach(drawEnemy);
    if (!(state === 'over' && overT > 0.05)) drawSanta();
    drawBeam();
    bullets.forEach(drawBullet);
    eb.forEach(drawEB);
  }
  drawParts();
  drawLighting();
  drawZaps();
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.5)); ctx.textAlign = 'center'; ctx.font = `bold ${t.size}px ${FONT}`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(5,10,30,.85)'; ctx.strokeText(t.s, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.s, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  ctx.fillStyle = '#fff';
  for (const f of flakes) {   // крупные снежинки ближе к камере: размытые
    const big = f.r > 2.4;
    ctx.globalAlpha = big ? .35 : .85; ctx.beginPath(); ctx.arc(f.x, f.y, big ? f.r * 1.8 : f.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBloom();
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,30,30,${hurtFlash * .35})`; ctx.fillRect(0, 0, W, H); }
  if (whiteFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${whiteFlash * .5})`; ctx.fillRect(0, 0, W, H); }
  if ((state === 'play' || state === 'pause') && enemyTimeMul() < 1) {   // замедление: голубая дымка, гаснет вместе с ним
    ctx.fillStyle = `rgba(110,170,255,${(1 - enemyTimeMul()) / (1 - SLOW_K) * (.13 + .03 * Math.sin(time * 5))})`; ctx.fillRect(0, 0, W, H);
  }

  if (state === 'play' || state === 'pause') screenSpace(() => {
    if (ia < .01) drawHUD();
    drawCallouts();
    if (DEBUG) { ctx.font = `bold 13px ${FONT}`; ctx.textAlign = 'right'; ctx.fillStyle = '#ffd23f'; ctx.fillText('DEBUG: Z X C V B — голос, I — ветер, 6 7 8 9 — новые бонусы, 0 — Гирлянда, K — Королева, J — ей −1/3 здоровья, N — конец волны, U — к финалу', W - 30, 88); }
  });
  drawBossIntro(ia);

  if (state === 'menu') {
    overlay(.55);
    bigText('HO-HO-BOOM!', H / 2 - 110, Math.min(110, W / 8), '#ff4d5a', '#ff4d5a');
    bigText('Спасите Новый год от армии Снежной Королевы!', H / 2 - 50, Math.min(30, W / 34), '#fff');
    ctx.font = `18px ${FONT}`; ctx.fillStyle = '#cfe3ff'; ctx.textAlign = 'center';
    const lines = ['WASD / стрелки — бегать  •  мышь — целиться  •  ЛКМ / Пробел — стрелять  •  Shift — рывок',
      'Стреляй по подаркам 🎁: бонусы, новое оружие… но иногда там ловушка!',
      'После каждой волны выбираешь улучшение. Каждые 5 волн — босс, в конце — Снежная Королева.',
      'Q / колесо мыши / 1–4 — оружие  •  Tab — навыки  •  P — пауза  •  R — заново  •  M — звук'];
    lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 5 + i * 30));
    if (loadDone()) drawModeButtons();
    else { ctx.font = `bold 28px ${FONT}`; ctx.fillStyle = '#ffd23f'; ctx.fillText(`Загрузка… ${ALL_IMGS.filter(im => im.complete).length} / ${ALL_IMGS.length}`, W / 2, H / 2 + 150); }
    ctx.font = `13px ${FONT}`; ctx.fillStyle = '#6f86b3'; ctx.textAlign = 'right'; ctx.fillText(`v${VERSION}`, W - 24, H - 20); ctx.textAlign = 'center';
  }
  if (state === 'upgrade') drawUpgrade();
  if (state === 'skills') drawSkills();
  if (state === 'pause') { overlay(.5); bigText('ПАУЗА', H / 2, 80, '#fff'); ctx.font = `20px ${FONT}`; ctx.fillStyle = '#cfe3ff'; ctx.textAlign = 'center'; ctx.fillText('P — продолжить   •   R — начать заново   •   Tab — навыки', W / 2, H / 2 + 50);
    const pct = v => Math.round(v * 100) + '%';
    ctx.fillText(`1 — музыка ${pct(VOL.music)}   •   2 — эффекты ${pct(VOL.sfx)}   •   3 — голос ${pct(VOL.voice)}`, W / 2, H / 2 + 86); }
  if (state === 'over') {
    const a = Math.min(1, Math.max(0, (overT - .5) * 1.5));
    ctx.globalAlpha = a; overlay(.6);
    bigText('Новый год отменяется…', H / 2 - 90, Math.min(70, W / 12), '#ff4d5a', '#ff4d5a');
    bigText(`Счёт: ${score.toLocaleString('ru-RU')}`, H / 2 - 20, 52);
    ctx.font = `22px ${FONT}`; ctx.fillStyle = '#cfe3ff'; ctx.textAlign = 'center';
    ctx.fillText(`Волна ${wave}  •  Убито: ${kills}  •  Рекорд: ${best.toLocaleString('ru-RU')}${score >= best && score > 0 ? '  🏆 новый!' : ''}`, W / 2, H / 2 + 28);
    ctx.globalAlpha = a * (.6 + .4 * Math.sin(time * 4)); ctx.font = `bold 26px ${FONT}`; ctx.fillStyle = '#ffd23f';
    ctx.fillText('Клик или Enter — ещё раз', W / 2, H / 2 + 90);
    ctx.globalAlpha = a; ctx.font = `17px ${FONT}`; ctx.fillStyle = '#8fa8d6'; ctx.fillText('Esc — выбрать режим', W / 2, H / 2 + 124); ctx.globalAlpha = 1;
  }
  if (state === 'win') {
    const a = Math.min(1, Math.max(0, (overT - .8) * 1.5));
    ctx.globalAlpha = a; overlay(.5);
    bigText('НОВЫЙ ГОД СПАСЁН!', H / 2 - 100, Math.min(76, W / 11), '#ffd23f', '#ffd23f');
    bigText(`Режим «${MODES[mode].n.toLowerCase()}» пройден`, H / 2 - 40, Math.min(30, W / 30), '#9ae6ff');
    bigText(`Счёт: ${score.toLocaleString('ru-RU')}`, H / 2 + 20, 48);
    ctx.font = `22px ${FONT}`; ctx.fillStyle = '#cfe3ff'; ctx.textAlign = 'center';
    ctx.fillText(`Убито: ${kills}  •  Рекорд: ${best.toLocaleString('ru-RU')}${score >= best && score > 0 ? '  🏆 новый!' : ''}`, W / 2, H / 2 + 64);
    ctx.globalAlpha = a * (.6 + .4 * Math.sin(time * 4)); ctx.font = `bold 26px ${FONT}`; ctx.fillStyle = '#ffd23f';
    ctx.fillText('Клик или Enter — в меню', W / 2, H / 2 + 124); ctx.globalAlpha = 1;
  }
  drawCrosshair();
}

/* ---------- ЦИКЛ ---------- */
let last = performance.now();
function frame(ts) {
  const raw = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (state !== 'pause' && state !== 'skills') time += raw;   // на паузе и в «Навыках» мир замирает
  let dt = raw;
  if (introT > 0 && state === 'play') {   // вступление босса: замедление времени
    introT -= raw; dt *= .15;
    shake = Math.max(shake, 4 * introA());
    if (introT <= 0) endIntro();
  } else if (slowT > 0) { slowT -= raw; dt *= .3; }
  if (state === 'play') update(dt);
  else if (state === 'over' || state === 'win') { overT += raw; updateFx(dt); for (const e of enemies) e.fl -= dt; if (state === 'win') winFx(raw); }
  else if (state === 'menu') updateFx(dt);
  else if (state === 'upgrade') { upT += raw; updateFx(raw); upgradeTick(raw); }
  if (state !== 'play') beamSound(false);   // пауза, выбор улучшения, конец игры: гул лазера выключить
  if (bgDirty && W && loadDone()) { bgDirty = false; buildBG(); }   // картинки догрузились: фон собирается один раз
  render();
  requestAnimationFrame(frame);
}

function winFx(dt) {   // салют на экране победы
  if (Math.random() < dt * 3) {
    const x = rand(80, W - 80), y = rand(80, H * .6), c = ['#ff4d4d', '#ffd23f', '#4be37a', '#4db8ff', '#ff7ad9', '#fff'][Math.floor(rand(0, 6))];
    burst(x, y, 50, [c, '#fff'], 320, 1.2, 4, true, 120); addRing(x, y, 110, c, .5); tone(rand(600, 1200), .25, 'triangle', .02, -300);
  }
}

/* ---------- ВВОД ---------- */
function startGame() {
  audioInit();
  if (!musicOn && AC) { musicOn = true; music(); }
  reset(); state = 'play';
}
addEventListener('resize', resize);
addEventListener('mousemove', e => { mx = e.clientX / ZOOM_OUT; my = e.clientY / ZOOM_OUT; });
addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mx = e.clientX / ZOOM_OUT; my = e.clientY / ZOOM_OUT;
  audioInit();
  if (state === 'menu' && !loadDone()) return;
  if (state === 'skills') return;
  if (state === 'menu') { const r = modeRects().find(r => mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h); if (r) pickMode(r.k); return; }
  if (state === 'over' && overT > .8) { startGame(); return; }
  if (state === 'win' && overT > 1.5) { state = 'menu'; return; }
  if (state === 'upgrade') {
    cardRects().forEach((r, i) => { if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) pickCard(i); });
    return;
  }
  mouseDown = true;
});
addEventListener('mouseup', () => { mouseDown = false; });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => {
  const now = performance.now();
  if (state === 'play' && now - lastWheel > 140) { lastWheel = now; cycleWeapon(e.deltaY > 0 ? 1 : -1); }
}, { passive: true });
addEventListener('blur', () => { mouseDown = false; for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
  keys[e.code] = true;
  audioInit();
  if (e.code === 'KeyM') muted = !muted;
  if (e.code === 'Tab' && !e.repeat) { toggleSkills(); return; }
  if (e.code === 'Escape' && state === 'skills') { toggleSkills(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play'; }
  if (e.code === 'Escape' && state === 'over' && overT > .8) state = 'menu';
  if (state === 'menu' && loadDone()) { const k = { Digit1: 'easy', Digit2: 'standard', Digit3: 'hardcore' }[e.code]; if (k) pickMode(k); }
  if (e.code === 'Enter' && state === 'win' && overT > 1.5) { state = 'menu'; return; }
  if (e.code === 'Enter' && ((state === 'menu' && loadDone()) || (state === 'over' && overT > .8))) startGame();
  if (e.code === 'KeyR' && (state === 'play' || state === 'pause' || (state === 'over' && overT > .8))) startGame();   // быстрый рестарт
  if (state === 'pause') { if (e.code === 'Digit1') cycleVol('music'); if (e.code === 'Digit2') cycleVol('sfx'); if (e.code === 'Digit3') cycleVol('voice'); }
  if (state === 'play') {
    // тест голоса: Z, X, C, V, B проигрывают фразы по очереди (double, triple, massacre, dominating, owning)
    if (TEST_KEYS) { const tv = { KeyZ: 'double_kill', KeyX: 'triple_kill', KeyC: 'massacre', KeyV: 'dominating', KeyB: 'owning' }[e.code]; if (tv) voice(tv, true); }
    if (TEST_KEYS) { const tb = { Digit6: 'shock', Digit7: 'knock', Digit8: 'hor', Digit9: 'slowmo' }[e.code]; if (tb) orbs.push({ x: P.x + 70, y: P.y, type: tb, life: 12, ph: 0 }); }
    if (TEST_KEYS && e.code === 'Digit0') { up.chain = Math.min(5, U('chain') + 1); addText(P.x, P.y - 40, '💡 Гирлянда ' + up.chain, '#ffd23f', 20); }
    if (TEST_KEYS && e.code === 'KeyK' && state === 'play') spawnEnemy('queen');   // тест: Снежная Королева
    if (TEST_KEYS && e.code === 'KeyJ') { const q = enemies.find(e => e.t === 'queen' && !e.hid); if (q) damageEnemy(q, q.mhp / 3 + 1); }   // тест: снять ей треть здоровья (следующая фаза)
    if (TEST_KEYS && e.code === 'KeyN') { spawnQ = []; introT = 0; for (const o of enemies) o.dead = true; }   // тест: закончить волну
    if (TEST_KEYS && e.code === 'KeyU') { wave = MODES[mode].waves - 1; spawnQ = []; introT = 0; for (const o of enemies) o.dead = true; }   // тест: сразу к последней волне
    if (TEST_KEYS && e.code === 'KeyI') windGust(clamp(P.x + rand(-150, 150), 120, W - 120), clamp(P.y + rand(-150, 150), 150, H - 120));
    if (e.code === 'KeyQ') cycleWeapon(1);
    if (e.code === 'Digit1') setWeapon('candy');
    if (e.code === 'Digit2') setWeapon('snowball');
    if (e.code === 'Digit3') setWeapon('laser');
    if (e.code === 'Digit4') setWeapon('mine');
  }
  if (state === 'upgrade') { const i = ['Digit1', 'Digit2', 'Digit3', 'Digit4'].indexOf(e.code); if (i >= 0) pickCard(i); }
});
addEventListener('keyup', e => { keys[e.code] = false; });

flakes = [];
for (let i = 0; i < 160; i++) flakes.push({ x: Math.random() * 1600, y: Math.random() * 1000, r: rand(1, 3.4), vy: rand(25, 80), ph: Math.random() * 6 });
resize();
mx = W / 2 + 120; my = H / 2;
reset(); state = 'menu';
requestAnimationFrame(frame);
</script>
</body>
</html>
